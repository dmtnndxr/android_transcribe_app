name: Build Android App

on:
  push:
    tags:
      - 'v*'
    branches:
      - '**'
  pull_request:
  # Lets a build be started without pushing, e.g. to re-run after adding
  # signing secrets.
  workflow_dispatch:

jobs:
  # Fast, secret-free checks. Runs on every push and PR, including from forks.
  # Needs no NDK, no Rust toolchain and no speech model, so it finishes in a
  # couple of minutes and reports real failures long before the heavy job would.
  verify:
    name: Tests and type-check
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Cache Gradle
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-verify-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-verify-

    # The same jars the container image bakes in. org.json is needed because
    # android.jar ships throwing stubs of it, so JVM tests need the real one.
    - name: Fetch test libraries
      run: |
        mkdir -p "$RUNNER_TEMP/testlibs"
        curl -fsSL -o "$RUNNER_TEMP/testlibs/json.jar" \
          https://repo1.maven.org/maven2/org/json/json/20240303/json-20240303.jar
        curl -fsSL -o "$RUNNER_TEMP/testlibs/junit-console.jar" \
          https://repo1.maven.org/maven2/org/junit/platform/junit-platform-console-standalone/1.11.3/junit-platform-console-standalone-1.11.3.jar

    # Same script the container runs, so local and CI results can't drift.
    # OpenRouter live tests stay skipped unless the secret is configured.
    - name: Run checks
      env:
        TESTLIBS: ${{ runner.temp }}/testlibs
        OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      run: bash tools/verify/verify.sh all

  build:
    name: Build APK
    runs-on: ubuntu-latest
    needs: verify
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Install Android NDK
      run: |
        sdkmanager --install "ndk;30.0.15729638"
        echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/30.0.15729638" >> $GITHUB_ENV

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: aarch64-linux-android

    # transcribe-cpp-sys compiles its C++ core (whisper.cpp/ggml) via CMake.
    # ubuntu-latest ships cmake/ninja, but install explicitly to be safe.
    - name: Install CMake & Ninja
      run: sudo apt-get update && sudo apt-get install -y cmake ninja-build

    - name: Install cargo-ndk
      run: cargo install cargo-ndk

    - name: Cache Rust dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-

    - name: Cache Gradle
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    # Forks don't inherit this repo's Plus signing secret. Decide up front which
    # kind of build is possible, rather
    # than discovering it at the packaging step after 30 minutes of compiling.
    #
    # Note this must test for a *non-empty* secret: `echo "" | base64 --decode`
    # exits 0 and writes a zero-byte file, which looks like a valid keystore to
    # a plain `exists()` check and then fails deep inside the signing task.
    - name: Determine signing mode
      id: signing
      env:
        PLUS_KEYSTORE_BASE64: ${{ secrets.PLUS_KEYSTORE_BASE64 }}
        PLUS_KEYSTORE_PASSWORD: ${{ secrets.PLUS_KEYSTORE_PASSWORD }}
      run: |
        if [ -n "$PLUS_KEYSTORE_BASE64" ] && [ -n "$PLUS_KEYSTORE_PASSWORD" ]; then
          echo "mode=release" >> $GITHUB_OUTPUT
          echo "Plus signing secrets present — building an updateable Plus APK."
        else
          echo "mode=debug" >> $GITHUB_OUTPUT
          echo "No Plus signing secrets — building a side-by-side debug APK instead."
          echo "It is signed with the auto-generated debug key and installs fine;"
          echo "only APKs signed by the stable Plus key can update one another."
        fi

    - name: Materialize Plus signing files
      if: steps.signing.outputs.mode == 'release'
      env:
        PLUS_KEYSTORE_BASE64: ${{ secrets.PLUS_KEYSTORE_BASE64 }}
        PLUS_KEYSTORE_PASSWORD: ${{ secrets.PLUS_KEYSTORE_PASSWORD }}
      run: |
        printf '%s' "$PLUS_KEYSTORE_BASE64" | base64 --decode > plus.keystore
        printf '%s' "$PLUS_KEYSTORE_PASSWORD" > plus-signing.pass
        chmod 600 plus.keystore plus-signing.pass
        if [ ! -s plus.keystore ] || [ ! -s plus-signing.pass ]; then
          echo "::error::Plus signing files are empty."
          exit 1
        fi

    - name: Build signed Plus APK
      if: steps.signing.outputs.mode == 'release'
      run: |
        ./gradlew assemblePlusRelease

    - name: Build side-by-side Plus debug APK
      if: steps.signing.outputs.mode == 'debug'
      run: |
        ./gradlew assemblePlusDebug

    - name: Extract Version Name
      id: extract_version
      run: |
        VERSION_NAME=$(grep 'versionName' app/build.gradle.kts | head -1 | grep -oP '"[^"]*"' | tr -d '"')
        echo "Detected Version: $VERSION_NAME"
        echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV

    # Both variants have the Plus application ID and can live next to the
    # original app. The debug suffix warns that only the stable release-signed
    # artifacts can update one another.
    - name: Rename Artifacts
      id: artifacts
      run: |
        if [ "${{ steps.signing.outputs.mode }}" = "release" ]; then
          cp app/build/outputs/apk/plus/release/app-plus-release.apk \
             offline-voice-input-plus-v${VERSION_NAME}.apk
          echo "files=offline-voice-input-plus-v${VERSION_NAME}.apk" >> $GITHUB_OUTPUT
        else
          cp app/build/outputs/apk/plus/debug/app-plus-debug.apk \
             offline-voice-input-plus-v${VERSION_NAME}-debug.apk
          echo "files=offline-voice-input-plus-v${VERSION_NAME}-debug.apk" >> $GITHUB_OUTPUT
        fi
        ls -lh offline-voice-input-plus-v${VERSION_NAME}*

    # retention-days caps how long these sit against the repo's Actions storage
    # allowance. The APK bundles the ~485 MB speech model, so one build per
    # branch push adds up quickly on a private repo.
    - name: Upload Plus APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: offline-voice-input-plus-${{ steps.signing.outputs.mode }}-v${{ env.VERSION_NAME }}-${{ github.run_number }}
        path: |
          offline-voice-input-plus-v${{ env.VERSION_NAME }}*.apk
        retention-days: 14
        if-no-files-found: error

    # Releases are the phone-friendly path: a direct .apk download with no
    # GitHub login and no zip to extract on-device. Tag pushes only.
    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        name: Release v${{ env.VERSION_NAME }}
        body: |
          Built from ${{ github.sha }}.
          Edition: Offline Voice Input+
          Signing: ${{ steps.signing.outputs.mode }}
        files: |
          offline-voice-input-plus-v${{ env.VERSION_NAME }}*.apk
